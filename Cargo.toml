[package]
name = "papers"
version = "0.1.1"
authors = ["Magnus Manske <magnusmanske@googlemail.com>"]
edition = "2021"
description = "A library to allow creation and updates of Wikidata items for scientific publications, authors, and related info"
repository = "https://github.com/magnusmanske/papers"
keywords = ["publications", "papers", "science", "wikidata"]
categories = ["api-bindings", "science"]
license = "MIT"
include = ["**/*.rs", "Cargo.toml"]

[dependencies]
serde_json = "1"
mysql_async = "0.36"
reqwest = { version = "0.13", features = ["json"] }
config = "0.15"
regex = "1"
lazy_static = "1"
chrono = "0.4"
dashmap = "6"
rayon = "1"
tokio = { version = "^1", features = ["full", "rt-multi-thread"] }
futures = "0.3"
async-trait = "0.1"
anyhow = "1"
rand = "0.10"        # 0.10 moved `random_range` onto `RngExt`; do not widen across majors
pico-args = "0.5"
deunicode = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
semanticscholar = "0.2"
orcid = "0.2"
pubmed = "0.2"
wikibase = "0.7"
arxiv-rs = "0.2"

# Async fork of `crossref`, published separately as `crossref-async` because the
# async API is not released upstream. Renamed back to `crossref` here so the
# `use crossref::...` paths match the SDK's own crate name.
# NOTE: must stay a registry dependency -- a `git` source cannot be published,
# and `crossref` on crates.io is the old blocking 0.2.x API.
crossref = { package = "crossref-async", version = "0.3" }

[dev-dependencies]
wiremock = "0.6"
tempfile = "3"
